<style>
:root {
  --bg:#0d0f14;--sidebar:#111318;--surface:#161920;--surface2:#1c1f28;
  --border:#252830;--border2:#2e3240;--accent:#e8c547;--green:#22c55e;
  --red:#ef4444;--blue:#3b82f6;--orange:#f97316;--purple:#a855f7;
  --text:#f1f3f9;--muted:#6b7280;--muted2:#4b5563;--sidebar-w:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;display:flex;}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.sidebar-logo img{width:100%;max-height:60px;object-fit:contain;object-position:left;}
.sidebar-section-label{padding:18px 16px 6px;font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted2);text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;margin:1px 8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;transition:all .15s;text-decoration:none;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(232,197,71,.1);color:var(--accent);}
.nav-item .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.nav-sub{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 44px;margin:1px 8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12px;transition:all .15s;text-decoration:none;}
.nav-sub:hover{background:var(--surface2);color:var(--text);}
.nav-sub.active{color:var(--accent);background:rgba(232,197,71,.08);}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;flex-shrink:0;background:var(--sidebar);border-bottom:1px solid var(--border);}
.topbar-title{font-size:14px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-date{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.privacy-btn{padding:5px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.privacy-btn.active{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--red);}
.privacy-mask{filter:blur(6px);user-select:none;}
.content{padding:20px 24px 60px;display:flex;flex-direction:column;gap:16px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted2);margin-bottom:-8px;}
/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-title{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-green{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.5);}
.dot-red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.5);}
.dot-amber{background:var(--accent);box-shadow:0 0 6px rgba(232,197,71,.5);}
.dot-blue{background:var(--blue);box-shadow:0 0 6px rgba(59,130,246,.5);}
.kpi-value{font-size:20px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.kpi-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.kpi-status{font-size:10.5px;}
.kpi-sub{font-size:10.5px;color:var(--muted2);}
/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.card-title{font-size:12.5px;font-weight:700;margin-bottom:4px;}
.card-sub{font-size:11px;color:var(--muted);margin-bottom:14px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
/* Table */
.tbl-wrap{overflow-x:auto;}
.ivr-table{width:100%;border-collapse:collapse;}
.ivr-table th{padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap;text-align:right;}
.ivr-table th:first-child{text-align:left;}
.ivr-table td{padding:8px 12px;font-size:12.5px;border-bottom:1px solid rgba(37,40,48,.5);text-align:right;white-space:nowrap;}
.ivr-table td:first-child{text-align:left;font-weight:500;}
.ivr-table tbody tr:hover{background:rgba(255,255,255,.02);}
.ivr-table td.num{font-family:'DM Mono',monospace;}
.ivr-table td.ing{font-family:'DM Mono',monospace;color:var(--green);font-weight:600;}
.ivr-table td.ideal{font-family:'DM Mono',monospace;color:var(--accent);font-weight:600;}
.ivr-table td.brecha-pos{font-family:'DM Mono',monospace;color:var(--red);font-weight:700;}
.ivr-table td.brecha-neg{font-family:'DM Mono',monospace;color:var(--green);font-weight:700;}
.ivr-table tr.last-row{background:rgba(232,197,71,.04);border-top:2px solid var(--accent);}
/* Editable cell */
.edit-cell{display:flex;align-items:center;gap:5px;justify-content:flex-end;}
.edit-input{width:80px;padding:3px 7px;background:var(--surface2);border:1px solid var(--accent);border-radius:5px;color:var(--text);font-size:12px;font-family:'DM Mono',monospace;outline:none;text-align:right;}
/* Breakdown badges */
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:600;margin-right:4px;}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}
.badge-amber{background:rgba(232,197,71,.12);color:var(--accent);}
.badge-blue{background:rgba(59,130,246,.12);color:var(--blue);}
.badge-green{background:rgba(34,197,94,.12);color:var(--green);}
/* Suc table */
.suc-table{width:100%;border-collapse:collapse;margin-top:8px;}
.suc-table th{padding:7px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);}
.suc-table td{padding:7px 10px;font-size:12px;border-bottom:1px solid rgba(37,40,48,.4);font-family:'DM Mono',monospace;text-align:right;}
.suc-table td:first-child{text-align:left;font-family:'Inter',sans-serif;}
/* Empty */
.empty-state{text-align:center;padding:60px;color:var(--muted);}
.empty-state .big{font-size:28px;display:block;margin-bottom:8px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

<script>
// ── SHARED LOADER — reads data + config from Google Sheets ────────────────────
// Immediate auth check
(function() {
  if (!sessionStorage.getItem('dashToken')) {
    window.location.replace('login.html');
  }
})();

const cfg        = JSON.parse(localStorage.getItem('dashboardConfig') || '{}');
const SUC_NAMES  = cfg.sucursalNames  || {};
let   SUC_ACTIVE = cfg.sucursalActive || {};
let   EG_EXCL    = cfg.egresosExcluidos || [];
let   PATTERNS   = cfg.patterns || ['Saldo de Caja'];
let   COND_PLAZOS= cfg.condicionPlazos || {};

// Apply remote config from Sheets (overrides localStorage)
function applyRemoteConfig(remoteConfig) {
  if (!remoteConfig) return;

  // Egresos excluidos
  if (remoteConfig.egresosExcluidos) {
    EG_EXCL = remoteConfig.egresosExcluidos.split(',').map(s => s.trim()).filter(Boolean);
  }

  // Sucursales activas
  const newSucActive = {};
  Object.keys(remoteConfig).forEach(k => {
    if (k.startsWith('sucursalActiva_')) {
      const suc = k.replace('sucursalActiva_', '');
      newSucActive[suc] = remoteConfig[k] !== 'false';
    }
  });
  if (Object.keys(newSucActive).length) SUC_ACTIVE = newSucActive;

  // Plazos de acreditación
  const newPlazos = {};
  Object.keys(remoteConfig).forEach(k => {
    if (k.startsWith('plazo_')) {
      const cond = k.replace('plazo_', '');
      newPlazos[cond] = parseInt(remoteConfig[k]) || 0;
    }
  });
  if (Object.keys(newPlazos).length) COND_PLAZOS = newPlazos;
}

function parseMonto(s) {
  if (!s && s !== 0) return 0;
  let str = String(s).trim().replace(/[$\s]/g, '');
  if (str === '' || str === '-') return 0;
  if (/^\d+(\.\d{1,2})?$/.test(str)) return parseFloat(str) || 0;
  if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(str)) {
    return parseFloat(str.replace(/\./g,'').replace(',','.')) || 0;
  }
  if (/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(str)) {
    return parseFloat(str.replace(/,/g,'')) || 0;
  }
  str = str.replace(/[^\d.,]/g,'');
  const lastDot = str.lastIndexOf('.');
  const lastComma = str.lastIndexOf(',');
  if (lastComma > lastDot) return parseFloat(str.replace(/\./g,'').replace(',','.')) || 0;
  return parseFloat(str.replace(/,/g,'')) || 0;
}

function parseDate(s) {
  if (!s) return null;
  const str = String(s).trim();
  const m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const m2 = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m2) return str.slice(0,10);
  if (/^\d+(\.\d+)?$/.test(str)) {
    const d = new Date((parseFloat(str) - 25569) * 86400 * 1000);
    return d.toISOString().slice(0,10);
  }
  return null;
}

function parseSheetRows(rows, type) {
  if (!rows || rows.length < 2) return [];
  let hdrIdx = -1;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    if (String(rows[i][0]||'').trim() === 'Fecha') { hdrIdx = i; break; }
  }
  if (hdrIdx < 0) return [];
  const result = [];
  for (let i = hdrIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || String(r[0]).trim() === '') continue;
    const dia = parseDate(String(r[0]).trim()); if (!dia) continue;
    if (type === 'cobranzas') {
      const sub = parseMonto(r[8]);
      if (sub < 0) continue;
      const suc = String(r[2]||'').trim();
      if (!suc || suc === 'Sucursal') continue;
      if (SUC_ACTIVE[suc] === false) continue;
      result.push({ Dia:dia, Mes:dia.slice(0,7), Sucursal:suc,
        Personal:String(r[3]||'').trim(), CondicionVenta:String(r[4]||'').trim(),
        Destino:String(r[6]||'').trim(), Alumno:String(r[7]||'').trim(), Subtotal:sub });
    } else if (type === 'pagos') {
      const monto = parseMonto(r[7]);
      if (monto <= 0) continue;
      const suc = String(r[2]||'').trim();
      if (!suc || suc === 'Sucursal') continue;
      if (SUC_ACTIVE[suc] === false) continue;
      const dest = String(r[6]||'').trim();
      if (EG_EXCL.includes(dest)) continue;
      if (PATTERNS.some(p => dest.includes(p))) continue;
      result.push({ Dia:dia, Mes:dia.slice(0,7), Sucursal:suc,
        Personal:String(r[3]||'').trim(), Observaciones:String(r[4]||'').trim(),
        Destino:dest, Monto:monto });
    } else if (type === 'otros') {
      const monto = parseMonto(r[5]);
      if (monto <= 0) continue;
      const obs = String(r[4]||'').trim();
      if (!obs.includes('IngresoVerificado')) continue;
      const conc = String(r[3]||'').trim();
      result.push({ Dia:dia, Mes:dia.slice(0,7), Sucursal:String(r[1]||'').trim(),
        Personal:String(r[2]||'').trim(), Concepto:conc,
        Observaciones:obs, Monto:monto });
    }
  }
  return result;
}

async function loadData(sheets = ['cobranzas']) {
  const token = sessionStorage.getItem('dashToken');
  if (!token) { window.location.href = 'login.html'; throw new Error('No autenticado'); }
  const resp = await fetch('/api/sheets', {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  if (resp.status === 401) {
    sessionStorage.removeItem('dashToken');
    window.location.href = 'login.html';
    throw new Error('Sesión expirada');
  }
  if (!resp.ok) throw new Error('Error ' + resp.status);
  const raw = await resp.json();

  // Apply remote config before parsing
  if (raw.config) applyRemoteConfig(raw.config);

  const result = {};
  if (sheets.includes('cobranzas'))    result.cobranzas     = parseSheetRows(raw.cobranzas,     'cobranzas');
  if (sheets.includes('pagos'))        result.pagos         = parseSheetRows(raw.pagos,         'pagos');
  if (sheets.includes('otros'))        result.otrosIngresos = parseSheetRows(raw.otrosIngresos, 'otros');
  result.config = raw.config || {};
  result.file   = 'Google Sheets';
  result.ts     = raw.ts || Date.now();
  return result;
}
</script>

<script>
const DAYS      = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MSHORT    = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MNAMES    = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SUC_COLORS= {Alvarado:'#3b82f6',Caseros:'#a855f7',España:'#22c55e',Doris:'#f97316'};

let cobRows=[];
let remoteConfig={};
let chartInst=null;
let privacyMode=false;

// Overrides — stored in Sheets Config (key='ivrOverrides'), cached in memory
const IVR_KEY = 'ivrOverrides';
let _ovrCache = null;

function loadOverrides() {
  if (_ovrCache !== null) return _ovrCache;
  try { return JSON.parse(localStorage.getItem(IVR_KEY)||'{}'); } catch(e) { return {}; }
}
function setOvrCache(d) {
  _ovrCache = d;
  try { localStorage.setItem(IVR_KEY, JSON.stringify(d)); } catch(e) {}
}
async function saveOverrides(d) {
  setOvrCache(d);
  const token = sessionStorage.getItem('dashToken');
  if (!token) return;
  try {
    await fetch('/api/save', {
      method:'POST',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({key:'ivrOverrides', value:JSON.stringify(d)})
    });
  } catch(e) { console.error('Error saving overrides:', e); }
}

// ── SESSION LOAD ──────────────────────────────────
// ── PRIVACY ───────────────────────────────────────
function togglePrivacy(){
  privacyMode=!privacyMode;
  const btn=document.getElementById('privacyBtn');
  btn.textContent=privacyMode?'🙈 Mostrar':'👁 Modo privado';
  btn.classList.toggle('active',privacyMode);
  document.querySelectorAll('.pv').forEach(el=>el.classList.toggle('privacy-mask',privacyMode));
}

// ── SIDEBAR ───────────────────────────────────────
function toggleNav(id){
  const el=document.getElementById('nav-'+id),ar=document.getElementById('arrow-'+id);

// ── INIT ──────────────────────────────────────────


// ── PARSE DESTINO ─────────────────────────────────
// Returns { type: 'corriente'|'anterior'|'otro', mes: 'YYYY-MM'|null }
function parseDestino(destino, cobMes) {
  // Match "Cuota [Mes] '[YY]" or "Cuota [Mes] [YY]"
  const m = destino.match(/^Cuota\s+(\w+)\s*[''`]?(\d{2,4})/i);
  if (!m) return { type:'otro', mes:null };
  const monthMap = {
    'enero':1,'febrero':2,'marzo':3,'abril':4,'mayo':5,'junio':6,
    'julio':7,'agosto':8,'setiembre':9,'septiembre':9,'octubre':10,'noviembre':11,'diciembre':12
  };
  const monNom = m[1].toLowerCase();
  const monNum = monthMap[monNom];
  if (!monNum) return { type:'otro', mes:null };
  let yr = parseInt(m[2]);
  if (yr < 100) yr += 2000;
  const desMes = `${yr}-${String(monNum).padStart(2,'0')}`;
  return {
    type: desMes === cobMes ? 'corriente' : 'anterior',
    mes: desMes
  };
}

// ── COMPUTE DATA ──────────────────────────────────
function getPadronConfig() {
  // Returns object { 'YYYY-MM': N } from remoteConfig keys starting with 'padron_'
  const result = {};
  if (typeof remoteConfig !== 'undefined' && remoteConfig) {
    Object.keys(remoteConfig).forEach(k => {
      if (k.startsWith('padron_')) {
        const mes = k.replace('padron_', '');
        const val = parseInt(remoteConfig[k]);
        if (val > 0) result[mes] = val;
      }
    });
  }
  return result;
}

function getPadronForMes(mes, meses, padronConfig) {
  // Direct config for this month
  if (padronConfig[mes]) return { value: padronConfig[mes], source: 'config' };
  // Fallback: walk backwards through previous months
  const idx = meses.indexOf(mes);
  for (let i = idx - 1; i >= 0; i--) {
    if (padronConfig[meses[i]]) return { value: padronConfig[meses[i]], source: 'anterior' };
  }
  return null; // no config at all — use deduced
}

function computeData() {
  // All real months from cobranzas
  const meses = [...new Set(cobRows.map(r=>r.Mes))].sort();
  const overrides = loadOverrides();
  const padronConfig = getPadronConfig();

  return meses.map(mes => {
    const rowsDelMes = cobRows.filter(r => r.Mes === mes);

    // Classify each row
    const cuotasCorrientes = rowsDelMes.filter(r => parseDestino(r.Destino, mes).type === 'corriente');
    const cuotasAnteriores = rowsDelMes.filter(r => parseDestino(r.Destino, mes).type === 'anterior');
    const becados          = cuotasCorrientes.filter(r => (r.Subtotal||0) === 0);
    const pagados          = cuotasCorrientes.filter(r => (r.Subtotal||0) > 0);

    // Padrón: check Config first, then override, then deduced
    const padronDeducido = new Set(cuotasCorrientes.map(r=>r.Alumno)).size;
    const padronFromConfig = getPadronForMes(mes, meses, padronConfig);
    const padronReal = parseInt(overrides[mes]?.alumnos) ||
                      (padronFromConfig ? padronFromConfig.value : 0) ||
                      padronDeducido;
    const padronSource = overrides[mes]?.alumnos ? 'override' :
                        padronFromConfig ? padronFromConfig.source : 'deducido';

    // Cuota promedio: promedio de cuotas corrientes pagadas
    const cuotaDeducida  = pagados.length > 0
      ? pagados.reduce((s,r)=>s+(r.Subtotal||0),0) / pagados.length
      : 0;
    const cuotaReal      = parseFloat(overrides[mes]?.cuota) || cuotaDeducida;

    // Ingreso ideal = padrón × cuota
    const ingresoIdeal = padronReal * cuotaReal;

    // Ingreso real de cuotas corrientes
    const ingresoRealCorriente = pagados.reduce((s,r)=>s+(r.Subtotal||0),0);

    // Ingreso total del mes (todas las cobranzas)
    const ingresoRealTotal = rowsDelMes.reduce((s,r)=>s+(r.Subtotal||0),0);

    // Alumnos que NO pagaron = padrón - alumnos con cuota corriente pagada
    const alumnosPagaron = new Set(pagados.map(r=>r.Alumno)).size;
    const alumnosNoPagaron = Math.max(0, padronReal - alumnosPagaron - becados.length);

    // Brecha = ideal - real corriente
    const brecha = ingresoIdeal - ingresoRealCorriente;

    // By sucursal
    const bySuc = {};
    ['Alvarado','Caseros','España','Doris'].forEach(s=>{
      const sp = pagados.filter(r=>r.Sucursal===s);
      const sb = becados.filter(r=>r.Sucursal===s);
      bySuc[s] = {
        pagados: new Set(sp.map(r=>r.Alumno)).size,
        becados: sb.length,
        monto: sp.reduce((s,r)=>s+(r.Subtotal||0),0)
      };
    });

    return {
      mes, padronDeducido, padronReal, padronSource,
      cuotaDeducida, cuotaReal,
      ingresoIdeal, ingresoRealCorriente, ingresoRealTotal,
      alumnosNoPagaron, becados: becados.length,
      cuotasAnteriores: cuotasAnteriores.length,
      montoAnteriores: cuotasAnteriores.reduce((s,r)=>s+(r.Subtotal||0),0),
      brecha, bySuc
    };
  });
}

// ── BUILD ─────────────────────────────────────────
function buildDashboard() {
  const data = computeData();
  if (!data.length) return;

  // Summary totals
  const totalIdeal   = data.reduce((s,d)=>s+d.ingresoIdeal,0);
  const totalReal    = data.reduce((s,d)=>s+d.ingresoRealCorriente,0);
  const totalBrecha  = data.reduce((s,d)=>s+d.brecha,0);
  const avgCobPct    = totalIdeal>0?(totalReal/totalIdeal*100):0;
  const totalNoPag   = data.reduce((s,d)=>s+d.alumnosNoPagaron,0);
  const totalBecados = data.reduce((s,d)=>s+d.becados,0);

  const lastMes  = data[data.length-1];
  const [ly,lm]  = lastMes.mes.split('-').map(Number);

  const content = document.getElementById('contentArea');
  content.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="section-label">Ideal vs Real — Cobranzas de Cuotas</div>
      <div style="font-size:11px;color:var(--muted);">${data.length} meses analizados</div>

    <!-- KPIs -->
    <div class="kpi-grid">

        <div class="kpi-bottom"><div class="kpi-status" style="color:var(--accent)">● Padrón × Cuota</div><div class="kpi-sub">acumulado</div></div>

        <div class="kpi-bottom"><div class="kpi-status" style="color:var(--green)">● ${avgCobPct.toFixed(1)}% cobrado</div><div class="kpi-sub">acumulado</div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><div class="kpi-title">Brecha Total</div><div class="status-dot dot-red"></div></div>
        <div class="kpi-value pv" style="color:var(--red)">${fmt(totalBrecha)}</div>
        <div class="kpi-bottom"><div class="kpi-status" style="color:var(--red)">● No cobrado</div><div class="kpi-sub">Ideal - Real</div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><div class="kpi-title">% Cobranza</div><div class="status-dot ${avgCobPct>=90?'dot-green':avgCobPct>=75?'dot-amber':'dot-red'}"></div></div>
        <div class="kpi-value" style="color:${avgCobPct>=90?'var(--green)':avgCobPct>=75?'var(--accent)':'var(--red)'}">${avgCobPct.toFixed(1)}%</div>
        <div class="kpi-bottom"><div class="kpi-status" style="color:var(--muted)">● Eficiencia global</div><div class="kpi-sub">del período</div></div>
      </div>
    </div>

    <!-- CHART -->
    <div class="card">
      <div class="card-title">Ideal vs Real por Mes</div>
      <div class="card-sub">Ingreso ideal (padrón × cuota) vs ingreso real de cuotas corrientes</div>
      <div style="height:180px;position:relative;"><canvas id="ivrChart"></canvas></div>
    </div>

    <!-- INFO BOX -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <div style="flex:1;min-width:200px;padding:12px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:9px;">
        <div style="font-size:11px;color:var(--red);font-weight:600;margin-bottom:4px;">ALUMNOS SIN PAGAR (acum.)</div>
        <div class="pv" style="font-size:22px;font-weight:700;color:var(--red);font-family:'DM Mono',monospace;">${totalNoPag.toLocaleString('es-AR')}</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:3px;">alumnos × mes sin cuota corriente</div>
      </div>
      <div style="flex:1;min-width:200px;padding:12px 16px;background:rgba(232,197,71,.08);border:1px solid rgba(232,197,71,.2);border-radius:9px;">
        <div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px;">BECADOS (acum.)</div>
        <div class="pv" style="font-size:22px;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace;">${totalBecados.toLocaleString('es-AR')}</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:3px;">cobros de $0 registrados</div>
      </div>
      <div style="flex:1;min-width:200px;padding:12px 16px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:9px;">
        <div style="font-size:11px;color:var(--blue);font-weight:600;margin-bottom:4px;">CUOTAS ANTERIORES COBRADAS</div>
        <div class="pv" style="font-size:22px;font-weight:700;color:var(--blue);font-family:'DM Mono',monospace;">${fmt(data.reduce((s,d)=>s+d.montoAnteriores,0))}</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:3px;">cobros de períodos anteriores</div>
      </div>
    </div>

    <!-- DETAIL TABLE -->
    <div class="section-label">Detalle por Mes</div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="tbl-wrap">
        <table class="ivr-table">
          <thead><tr>
            <th style="text-align:left;">Mes</th>
            <th>Padrón<br><span style="font-size:9px;font-weight:400;">(deducido)</span></th>
            <th>Padrón<br><span style="font-size:9px;font-weight:400;">(corregido ✏️)</span></th>
            <th>Cuota Prom.<br><span style="font-size:9px;font-weight:400;">(corregida ✏️)</span></th>
            <th>Ideal</th>
            <th>Real</th>
            <th>Brecha</th>
            <th>% Cob.</th>
            <th>Sin pagar</th>
            <th>Becados</th>
            <th>Cuot. Ant.</th>
          </tr></thead>
          <tbody id="ivrTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- BY SUCURSAL (last month) -->
    <div class="section-label">Por Sucursal — ${MNAMES[lm]} ${ly}</div>
    <div id="sucSection"></div>
  `;

  renderTable(data);
  renderSucursal(lastMes);
  renderChart(data);
  if(privacyMode)document.querySelectorAll('.pv').forEach(el=>el.classList.add('privacy-mask'));
}

// ── TABLE ─────────────────────────────────────────
function renderTable(data) {
  const overrides = loadOverrides();
  const tbody = document.getElementById('ivrTableBody');
  tbody.innerHTML = data.map(d => {
    const [y,m] = d.mes.split('-').map(Number);
    const cobPct = d.ingresoIdeal > 0 ? (d.ingresoRealCorriente/d.ingresoIdeal*100) : 0;
    const isLast = d === data[data.length-1];
    return `<tr class="${isLast?'last-row':''}">
      <td style="font-weight:600;">${MSHORT[m]} ${y}</td>
      <td class="num" style="color:var(--muted)">${d.padronDeducido}</td>
      <td class="num">
        <div class="edit-cell">
          <input class="edit-input" type="number" value="${d.padronReal}"
            onchange="saveOverride('${d.mes}','alumnos',this.value)"
            title="Corregir padrón de alumnos">
        </div>
      </td>
      <td class="num">
        <div class="edit-cell">
          <input class="edit-input" type="number" value="${Math.round(d.cuotaReal)}"
            onchange="saveOverride('${d.mes}','cuota',this.value)"
            title="Corregir valor de cuota">
        </div>
      </td>
      <td class="ideal pv">${fmt(d.ingresoIdeal)}</td>
      <td class="ing pv">${fmt(d.ingresoRealCorriente)}</td>
      <td class="${d.brecha>0?'brecha-pos':'brecha-neg'} pv">${d.brecha>0?'+':''} ${fmt(Math.abs(d.brecha))}</td>
      <td class="num" style="color:${cobPct>=90?'var(--green)':cobPct>=75?'var(--accent)':'var(--red)'}">
        ${cobPct.toFixed(1)}%
      </td>
      <td class="num" style="color:var(--red)">${d.alumnosNoPagaron}</td>
      <td class="num" style="color:var(--accent)">${d.becados}</td>
      <td class="num" style="color:var(--blue)">${d.cuotasAnteriores}</td>
    </tr>`;
  }).join('');
}

// ── SAVE OVERRIDE ─────────────────────────────────
async function saveOverride(mes, field, value) {
  const overrides = loadOverrides();
  if (!overrides[mes]) overrides[mes] = {};
  overrides[mes][field] = parseFloat(value)||0;
  await saveOverrides(overrides);
  const data = computeData();
  renderTable(data);
  renderChart(data);
  renderSucursal(data[data.length-1]);
}

// ── CHART ─────────────────────────────────────────
function renderChart(data) {
  const ctx = document.getElementById('ivrChart')?.getContext('2d');
  if (!ctx) return;
  if (chartInst) { chartInst.destroy(); chartInst=null; }
  const labels = data.map(d => { const [y,m]=d.mes.split('-').map(Number); return MSHORT[m]+' '+String(y).slice(2); });
  chartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label:'Ideal',  data:data.map(d=>d.ingresoIdeal),          backgroundColor:'rgba(232,197,71,0.3)', borderRadius:3, borderWidth:0 },
        { label:'Real',   data:data.map(d=>d.ingresoRealCorriente),   backgroundColor:'rgba(34,197,94,0.75)', borderRadius:3, borderWidth:0 },
        { label:'Brecha', data:data.map(d=>d.brecha),                 backgroundColor:'rgba(239,68,68,0.5)',  borderRadius:3, borderWidth:0, type:'bar' }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:'#7a7f96',font:{size:11},boxWidth:10,padding:12}},
        tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.raw)}}
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#4b5563',font:{size:10}}},
        y:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#4b5563',font:{size:10},callback:v=>fmtShort(v)}}
      }
    }
  });
}

// ── BY SUCURSAL ───────────────────────────────────
function renderSucursal(d) {
  const sucs = ['Alvarado','Caseros','España','Doris'];
  const html = `<div class="two-col">` + sucs.map(suc => {
    const s = d.bySuc[suc] || {pagados:0,becados:0,monto:0};
    const color = SUC_COLORS[suc]||'#6b7280';
    return `<div class="card">
      <div class="card-title">
        <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;"></div>
        ${SUC_NAMES[suc]||suc}
      </div>
      <table class="suc-table">
        <tr><td style="font-family:'Inter',sans-serif;color:var(--muted)">Alumnos que pagaron</td><td style="color:var(--green)">${s.pagados}</td></tr>
        <tr><td style="font-family:'Inter',sans-serif;color:var(--muted)">Becados</td><td style="color:var(--accent)">${s.becados}</td></tr>
        <tr><td style="font-family:'Inter',sans-serif;color:var(--muted)">Monto recaudado</td><td class="pv" style="color:var(--green)">${fmt(s.monto)}</td></tr>
      </table>
    </div>`;
  }).join('') + `</div>`;
  document.getElementById('sucSection').innerHTML = html;
  if(privacyMode)document.querySelectorAll('.pv').forEach(el=>el.classList.add('privacy-mask'));
}

// ── UTILS ─────────────────────────────────────────
function fmt(n){return'$'+Math.round(n).toLocaleString('es-AR');}
function fmtShort(n){
  if(n>=1e9)return'$'+(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';
  return'$'+Math.round(n);
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!sessionStorage.getItem('dashToken')) { window.location.href = 'login.html'; return; }
  // Set today label
  const _now = new Date();
  const _days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const _ms   = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const _lbl  = document.getElementById('todayLabel');
  if (_lbl) _lbl.textContent = _days[_now.getDay()] + ' ' + _now.getDate() + ' ' + _ms[_now.getMonth()] + ' ' + _now.getFullYear();

  // Load data from API
  const _overlay = document.getElementById('dataLoadingOverlay');
  if (_overlay) _overlay.style.display = 'flex';
  try {
    const _data = await loadData(['cobranzas']);
    allRows = _data.cobranzas;
    // Store remote config for padron lookup
    if (_data.config) remoteConfig = _data.config;
    // Load overrides from Sheets Config
    if (_data.config && _data.config.ivrOverrides) {
      try {
        const _ro = JSON.parse(_data.config.ivrOverrides);
        if (typeof setOvrCache === 'function') setOvrCache(typeof _ro === 'object' ? _ro : {});
      } catch(e) {}
    }
    const _fl = document.getElementById('fileLabel');
    const _mins = Math.round((Date.now() - _data.ts) / 60000);
    const _ago  = _mins < 1 ? 'recién' : _mins < 60 ? 'hace ' + _mins + 'm' : 'hace ' + Math.round(_mins/60) + 'h';
    if (_fl) _fl.textContent = 'Google Sheets · ' + _ago;
    buildDashboard();
  } catch(e) {
    console.error('Error loading data:', e);
    const _c = document.getElementById('contentArea');
    if (_c) _c.innerHTML = `<div class="empty-state">
      <span class="big">⚠️</span>
      Error al cargar datos: ${e.message}<br>
      <a href="index.html" style="color:var(--accent);font-size:12px;">← Volver al Dashboard</a>
    </div>`;
  } finally {
    if (_overlay) _overlay.style.display = 'none';
  }
});
function logout() {
  sessionStorage.removeItem('dashToken');
  window.location.href = 'login.html';
}
</script>
